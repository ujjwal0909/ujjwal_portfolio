  <!-- ===================================================================
       Bootstrap: fetch app.js and transpile it with Babel using the CLASSIC
       JSX runtime (runtime:"classic"). This is deliberate: modern Babel
       defaults the react preset to the "automatic" runtime, which emits
       `import { jsx } from "react/jsx-runtime"` — an ES import that throws
       in a plain browser with no bundler/import-map. Forcing classic makes
       Babel emit React.createElement, which works with the UMD React above.
       =================================================================== -->
  <script>
    (function bootstrap() {
      function fail(msg, detail) {
        var el = document.getElementById("root");
        if (el) {
          el.innerHTML =
            '<div style="max-width:640px;margin:18vh auto;padding:24px;font-family:Inter,system-ui,sans-serif;color:#cbd5e1;text-align:center">' +
            '<h1 style="font-size:22px;color:#fff;margin-bottom:10px">Couldn\'t load the portfolio</h1>' +
            '<p style="font-size:14px;line-height:1.6">' + msg + '</p>' +
            (detail ? '<pre style="text-align:left;white-space:pre-wrap;font-size:12px;background:#111827;padding:12px;border-radius:10px;margin-top:14px">' + detail + '</pre>' : '') +
            '<p style="font-size:13px;margin-top:16px;color:#64748b">Tip: serve this folder over http:// (e.g. <code>python3 -m http.server</code>) rather than opening the file directly.</p>' +
            '</div>';
        }
        console.error(msg, detail || "");
      }

      function run() {
        if (!window.Babel) { return fail("Babel failed to load from the CDN. Check your network connection."); }
        if (!window.React || !window.ReactDOM) { return fail("React failed to load from the CDN. Check your network connection."); }

        fetch("app.js")
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status + " fetching app.js");
            return r.text();
          })
          .then(function (src) {
            var out;
            try {
              out = window.Babel.transform(src, {
                presets: [["react", { runtime: "classic" }]],
                filename: "app.js",
              }).code;
            } catch (e) {
              return fail("There was a syntax error compiling the app.", (e && e.message) || String(e));
            }
            try {
              // Execute in global scope.
              (0, eval)(out);
            } catch (e) {
              return fail("The app threw while starting up.", (e && (e.stack || e.message)) || String(e));
            }
          })
          .catch(function (e) {
            fail("Could not fetch app.js. If you opened this file directly, serve the folder over http:// instead.", (e && e.message) || String(e));
          });
      }

      if (document.readyState === "complete" || document.readyState === "interactive") {
        setTimeout(run, 0);
      } else {
        document.addEventListener("DOMContentLoaded", run);
      }
    })();
  </script>
